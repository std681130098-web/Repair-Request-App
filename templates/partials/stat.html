<div class="col-6 col-lg-3">
  <div class="stat-card p-3 h-100 d-flex align-items-center gap-3">
    <div class="stat-ico bg-{{ color }} bg-opacity-10 text-{{ color }}"><i class="bi bi-{{ icon }}"></i></div>
    <div>
      <div class="num text-{{ color }}">{{ num|default:0 }}</div>
      <div class="lbl">{{ label }}</div>
    </div>
  </div>
</div>
